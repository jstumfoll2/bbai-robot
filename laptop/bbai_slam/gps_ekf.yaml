# EKF for the GPS-fused global estimate (see gps_fusion.launch)
frequency: 20
sensor_timeout: 0.5
two_d_mode: true
publish_tf: false
map_frame: gps_map
odom_frame: odom
base_link_frame: base_link
world_frame: gps_map

# Wheel odometry from the board: forward speed only (heading comes from the IMU)
odom0: /odom
odom0_config: [false, false, false,
               false, false, false,
               true,  false, false,
               false, false, false,
               false, false, false]
odom0_differential: false

# Compass yaw + gyro rate from the board (/imu/data, needs mag calibration)
imu0: /imu/data
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_remove_gravitational_acceleration: true

# GPS position converted to the gps_map frame by navsat_transform
odom1: /odometry/gps
odom1_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
