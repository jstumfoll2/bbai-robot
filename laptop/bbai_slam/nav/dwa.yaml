# Slow and cautious: lidar sees only one plane, so low obstacles are invisible
DWAPlannerROS:
  max_vel_x: 0.20
  min_vel_x: 0.0          # no driving backward (lidar is the only sensor)
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.20
  min_vel_trans: 0.08
  max_vel_theta: 1.5
  min_vel_theta: 0.8      # below this the skid steer stalls
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 4.0
  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.4
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  vx_samples: 8
  vth_samples: 20
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  forward_point_distance: 0.2
  oscillation_reset_dist: 0.05
  holonomic_robot: false
