# AMCL on the saved house map. RPLIDAR A1 (~7 Hz, 360 beams), wheel+gyro odometry.
odom_model_type: diff-corr
odom_frame_id: odom
base_frame_id: base_link
global_frame_id: map
use_map_topic: true
transform_tolerance: 0.5
min_particles: 300
max_particles: 2000        # runs off-board, so particles are cheap
update_min_d: 0.10
update_min_a: 0.20
resample_interval: 1
laser_model_type: likelihood_field
laser_max_beams: 90
laser_max_range: 8.0
laser_z_hit: 0.9
laser_z_rand: 0.1
laser_sigma_hit: 0.1
laser_likelihood_max_dist: 2.0
odom_alpha1: 0.2           # rotation noise from rotation (skid steer slips when turning)
odom_alpha2: 0.1
odom_alpha3: 0.1
odom_alpha4: 0.1
recovery_alpha_slow: 0.001 # re-spread particles if the scan stops matching (kidnapped robot)
recovery_alpha_fast: 0.1
